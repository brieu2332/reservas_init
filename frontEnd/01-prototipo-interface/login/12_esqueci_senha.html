<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Esqueci a Senha</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='login/06_primeiro_acesso.css') }}">
</head>
<body>

  <div class="navegacao">   
    <a href="{{ url_for('diaria') }}">Diária</a> 
    <a href="{{ url_for('semanal') }}">Semanal</a> 
    <a href="{{ url_for('listagem') }}" class="listagem">Listagem</a> 
    <a href="{{ url_for('reservar') }}">Reservar</a>
    <a href="{{ url_for('admin') }}">Admin</a>
    <a href="{{ url_for('primeiro_acesso') }}">Primeiro Acesso</a>
  </div>

  <div class="fundo-escuro">
    <div class="modal-box">
      <h2>Recuperar Senha</h2>

      <form action="{{ url_for('enviar_recuperacao') }}" method="post">
        <label for="email">Digite seu e-mail</label>
        <input type="email" id="email" name="email" required>

        <button type="submit" class="btn-cadastrar">Enviar link de recuperação</button>

        <p class="login-link">
            <a href="{{ url_for('login_page') }}">Voltar para o login</a>
        </p>
      </form>
    </div>
  </div>

</body>
</html>
