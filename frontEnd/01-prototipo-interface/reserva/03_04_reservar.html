<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fazer Reserva</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='reserva/03_04_styles_reserva.css') }}">
</head>

<body>
  <header class="navbar">
    <nav class="nav-buttons">
      <a href="{{ url_for('diaria') }}">Diária</a>
      <a href="{{ url_for('semanal') }}">Semanal</a>
      <a href="{{ url_for('listagem') }}">Listagem</a>
      <a href="{{ url_for('reservar') }}">Reservar</a>
      <a href="{{ url_for('admin') }}">Admin</a>
      <a href="{{ url_for('primeiro_acesso') }}">Primeiro Acesso</a>
    </nav>
  </header>

  <div id="modalReserva" class="modal">
    <div class="modal-content">
      <div>
        <h2>Nova Reserva</h2>
        <p>Preencha os campos para reservar uma sala.</p>
      </div>

      <form action="{{ url_for('salvar_reserva') }}" method="POST">
        <div class="edit">
          <div class="setting">
            <h3>Data da reserva</h3>
            <input type="date" name="reservation_date" value="{{ hoje_iso }}" required>
          </div>

          <div class="setting">
            <h3>Horário de Início</h3>
            <input type="time" name="hora_inicio" min="08:00" max="23:00" value="13:00" required>
          </div>

          <div class="setting">
            <h3>Horário de Fim</h3>
            <input type="time" name="hora_fim" min="08:00" max="23:00" value="14:00" required>
          </div>

          <div class="setting">
            <h3>Matéria / Finalidade</h3>
            <input list="materias" name="materia" value="SO - BCC" required>
            <datalist id="materias">
              <option value="SO - BCC">
              <option value="Inglês - Médio">
              <option value="Cálculo I - BCC">
              <option value="Cálculo I - BEE">
            </datalist>
          </div>

          <div class="setting">
            <h3>Laboratório</h3>
            <select name="laboratorio" required>
              {% for room in rooms %}
                <option value="{{ room }}" {% if room == 'A03' %}selected{% endif %}>{{ room }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="setting">
            <h3>Detalhes / Turma</h3>
            <input type="text" name="detalhes" placeholder="Ex.: 1ª fase BCC" />
          </div>
        </div>

        <div class="cancelar-salvar">
          <button type="button" class="cancelar" onclick="window.location.href='{{ url_for('diaria') }}'">Cancelar</button>
          <button type="submit" class="salvar">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
