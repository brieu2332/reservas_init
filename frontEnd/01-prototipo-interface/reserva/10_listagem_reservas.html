<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Histórico de Alocações</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='reserva/10_listagem.css') }}" />
</head>

<body>
  <header class="header-card">
    <h1>SIRA</h1>
    <p class="subtitulo">Sistema de Reservas de Ambientes</p>
    <nav>
      <a href="{{ url_for('diaria') }}">Diária</a>
      <a href="{{ url_for('semanal') }}">Semanal</a>
      <a class="active-nav" href="{{ url_for('listagem') }}">Listagem</a>
      <a href="{{ url_for('reservar') }}">Reservar</a>
      <a href="{{ url_for('admin') }}">Admin</a>
      <a href="{{ url_for('primeiro_acesso') }}">Primeiro Acesso</a>
    </nav>
  </header>

  <h2>Histórico de Alocações</h2>

  <div class="search-bar">
    <label for="searchInput">Pesquisar:</label>
    <input type="text" id="searchInput" onkeyup="filtrarTabela()" placeholder="Digite algo...">
  </div>

  <table id="reservas">
    <thead>
      <tr>
        <th>Data da Reserva</th>
        <th>Local</th>
        <th>Horário</th>
        <th>Usuário</th>
        <th>Finalidade</th>
        <th>Detalhes</th>
      </tr>
    </thead>
    <tbody id="tbody-reservas"></tbody>
  </table>

  <div id="pagination" class="pagination"></div>

  <script>
    const reservas = {{ dados_banco|tojson }};

    const linhasPorPagina = 10;
    let paginaAtual = 1;

    function renderizarTabela() {
      const tbody = document.getElementById("tbody-reservas");
      tbody.innerHTML = "";
      const inicio = (paginaAtual - 1) * linhasPorPagina;
      const fim = inicio + linhasPorPagina;
      const reservasPagina = reservas.slice(inicio, fim);

      reservasPagina.forEach(reserva => {
        const linha = `
          <tr>
            <td>${reserva.data}</td>
            <td>${reserva.local}</td>
            <td>${reserva.horario}</td>
            <td><strong>${reserva.usuario}</strong></td>
            <td><em>${reserva.finalidade}</em></td>
            <td>${reserva.turma}</td>
          </tr>`;
        tbody.innerHTML += linha;
      });
    }

    function criarPaginacao() {
      const pagDiv = document.getElementById("pagination");
      pagDiv.innerHTML = "";
      const totalPaginas = Math.ceil(reservas.length / linhasPorPagina);

      for (let i = 1; i <= totalPaginas; i++) {
        pagDiv.innerHTML += `
          <a href="#" onclick="mudarPagina(${i}); return false;" class="${paginaAtual === i ? 'active' : ''}">${i}</a>`;
      }
    }

    function mudarPagina(pagina) {
      paginaAtual = pagina;
      renderizarTabela();
      criarPaginacao();
    }

    function filtrarTabela() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const linhas = document.getElementById("tbody-reservas").getElementsByTagName("tr");

      for (let i = 0; i < linhas.length; i++) {
        const textoLinha = linhas[i].textContent.toLowerCase();
        linhas[i].style.display = textoLinha.includes(input) ? "" : "none";
      }
    }

    renderizarTabela();
    criarPaginacao();
  </script>
</body>
</html>
