<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Reservas - Visualização Diária</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='tabelas/01_index_tela_inicial.css') }}">
  </head>
  <body>
    <header>
      <h1>SIRA</h1>
      <p class="subtitulo">Sistema de Reservas de Ambientes</p>
      <nav class="navegacao">
        <a class="ativo" href="{{ url_for('diaria') }}">Diária</a>
        <a href="{{ url_for('semanal') }}">Semanal</a>
        <a href="{{ url_for('listagem') }}">Listagem</a>
        <a href="{{ url_for('reservar') }}">Reservar</a>
        <a href="{{ url_for('admin') }}">Admin</a>
        <a href="{{ url_for('primeiro_acesso') }}">Primeiro Acesso</a>
      </nav>
    </header>

    
    <section class="controle-data">
      <div class="filtros-turno" style="text-align: center; margin-bottom: 20px;">
        <h2 class="page-title">Visualização Diária</h2>
        <label><input type="checkbox" class="filtro-turno" value="manha" checked> Manhã</label>
        <label><input type="checkbox" class="filtro-turno" value="tarde" checked> Tarde</label>
        <label><input type="checkbox" class="filtro-turno" value="noite" checked> Noite</label>
      </div>

      <div class="data-container">
        <button id="dia-anterior" type="button"><i class="fa-solid fa-less-than"></i></button>
        <span id="dia-atual"></span>
        <button id="dia-proximo" type="button"><i class="fa-solid fa-greater-than"></i></button>
      </div>
    </section>

    <table id="tabela">
      <thead>
        <tr>
          <th>Hora</th>
          {% for room in rooms %}
            <th>{{ room }}</th>
          {% endfor %}
        </tr>
      </thead>
      <tbody id="corpo-tabela">
        {% for h in range(8,24) %}
          <tr>
            <th>{{ h }}h</th>
            {% for room in rooms %}
              <td data-room="{{ room }}" data-hour="{{ h }}"></td>
            {% endfor %}
          </tr>
        {% endfor %}
      </tbody>
    </table>

    <a class="adicionar-reserva-btn" href="{{ url_for('reservar') }}" aria-label="Adicionar reserva">
      <i class="fas fa-plus"></i>
      <span>Adicionar reserva</span>
    </a>

    <script>
      let dataAtual = new Date();
      const reservas = {{ reservas|tojson }};

      function formatarData(data) {
        return data.toLocaleDateString("pt-BR", {
          weekday: "long",
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        });
      }

      function formatarISO(data) {
        const ano = data.getFullYear();
        const mes = String(data.getMonth() + 1).padStart(2, '0');
        const dia = String(data.getDate()).padStart(2, '0');
        return `${ano}-${mes}-${dia}`;
      }

      function limparTabela() {
        document.querySelectorAll('#corpo-tabela td').forEach(td => {
          td.innerHTML = '';
          td.classList.remove('tem-reserva');
        });
      }

      function turnoDaHora(hora) {
        if (hora >= 8 && hora <= 12) return 'manha';
        if (hora >= 13 && hora <= 17) return 'tarde';
        return 'noite';
      }

      function turnosSelecionados() {
        return Array.from(document.querySelectorAll('.filtro-turno:checked')).map(x => x.value);
      }

      function carregarReservasDoDia() {
        limparTabela();
        const dataISO = formatarISO(dataAtual);
        const turnos = turnosSelecionados();

        reservas
          .filter(r => r.data === dataISO)
          .forEach(r => {
            const hora = parseInt(r.hora_inicio.split(':')[0], 10);
            if (!turnos.includes(turnoDaHora(hora))) return;

            const celula = document.querySelector(`td[data-room="${r.local}"][data-hour="${hora}"]`);
            if (!celula) return;

            celula.classList.add('tem-reserva');
            celula.innerHTML = `<div class="reserva-tag"><strong>${r.finalidade}</strong><br>${r.hora_inicio} - ${r.hora_fim}<br>${r.usuario}</div>`;
          });
      }

      function atualizarData() {
        document.getElementById('dia-atual').textContent = formatarData(dataAtual);
        carregarReservasDoDia();
      }

      document.getElementById('dia-anterior').addEventListener('click', () => {
        dataAtual.setDate(dataAtual.getDate() - 1);
        atualizarData();
      });

      document.getElementById('dia-proximo').addEventListener('click', () => {
        dataAtual.setDate(dataAtual.getDate() + 1);
        atualizarData();
      });

      document.querySelectorAll('.filtro-turno').forEach(chk => chk.addEventListener('change', carregarReservasDoDia));

      atualizarData();
    </script>
  </body>
</html>
