<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservas Semanais</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='tabelas/02_style.css') }}" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body>
  <header>
    <h1>SIRA</h1>
    <p class="subtitulo">Sistema de Reservas de Ambientes</p>
    <nav class="navegacao">
      <a href="{{ url_for('diaria') }}">Diária</a>
      <a class="ativo" href="{{ url_for('semanal') }}">Semanal</a>
      <a href="{{ url_for('listagem') }}">Listagem</a>
      <a href="{{ url_for('reservar') }}">Reservar</a>
      <a href="{{ url_for('admin') }}">Admin</a>
      <a href="{{ url_for('primeiro_acesso') }}">Primeiro Acesso</a>
    </nav>
  </header>

  <h2 class="page-title">Mapa de Ocupação Semanal</h2>

  <main>
    <section class="controle-data">
      <div class="filtros-turno" style="text-align: center; margin-bottom: 20px;">
        <label><input type="checkbox" class="filtro-turno" value="manha" checked> Manhã</label>
        <label><input type="checkbox" class="filtro-turno" value="tarde" checked> Tarde</label>
        <label><input type="checkbox" class="filtro-turno" value="noite" checked> Noite</label>
      </div>

      <div class="data-container">
        <button id="semana-anterior" type="button"><i class="fa-solid fa-less-than"></i></button>
        <span id="semana-atual"></span>
        <button id="semana-proximo" type="button"><i class="fa-solid fa-greater-than"></i></button>
      </div>
    </section>

    <div class="tabela-container">
      <table id="tabela-semanal">
        <thead>
          <tr>
            <th>Semana</th>
            {% for room in rooms %}
              <th>{{ room }}</th>
            {% endfor %}
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </div>

    <div class="legenda-calor" aria-label="Legenda de ocupação">
      <span>Menos</span>
      <div class="swatch heat-0"></div>
      <div class="swatch heat-1"></div>
      <div class="swatch heat-2"></div>
      <div class="swatch heat-3"></div>
      <div class="swatch heat-4"></div>
      <span>Mais</span>
    </div>

    <a class="adicionar-reserva-btn" href="{{ url_for('reservar') }}" aria-label="Adicionar reserva">
      <i class="fas fa-plus"></i>
      <span>Adicionar reserva</span>
    </a>
  </main>

  <script>
    const reservas = {{ reservas|tojson }};
    const rooms = {{ rooms|tojson }};
    let semanaInicio = new Date();

    function inicioDaSemana(data) {
      const d = new Date(data);
      const dia = d.getDay();
      const diff = d.getDate() - dia + (dia === 0 ? -6 : 1);
      d.setDate(diff);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function toISO(data) {
      const y = data.getFullYear();
      const m = String(data.getMonth() + 1).padStart(2, '0');
      const d = String(data.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function turnoDaHora(h) {
      if (h >= 8 && h <= 12) return 'manha';
      if (h >= 13 && h <= 17) return 'tarde';
      return 'noite';
    }

    function getTurnos() {
      return Array.from(document.querySelectorAll('.filtro-turno:checked')).map(x => x.value);
    }

    function formatarLabelSemana() {
      const fim = new Date(semanaInicio);
      fim.setDate(fim.getDate() + 4);
      return `${semanaInicio.toLocaleDateString('pt-BR')} até ${fim.toLocaleDateString('pt-BR')}`;
    }

    function turnoReserva(reserva) {
      const hora = parseInt(reserva.hora_inicio.split(':')[0], 10);
      return turnoDaHora(hora);
    }

    function reservasDaCelula(dataISO, room, turnos) {
      return reservas
        .filter(r => (
          r.data === dataISO &&
          r.local === room &&
          turnos.includes(turnoReserva(r))
        ))
        .sort((a, b) => a.hora_inicio.localeCompare(b.hora_inicio));
    }

    function indiceCalor(totalReservas, maxReservas) {
      if (totalReservas === 0 || maxReservas === 0) return 0;
      const proporcao = totalReservas / maxReservas;
      if (proporcao <= 0.25) return 1;
      if (proporcao <= 0.5) return 2;
      if (proporcao <= 0.75) return 3;
      return 4;
    }

    function mapaSemana(turnos) {
      const mapa = [];
      let maxReservas = 0;

      for (let d = 0; d < 5; d++) {
        const dia = new Date(semanaInicio);
        dia.setDate(dia.getDate() + d);
        const diaISO = toISO(dia);

        const linha = {
          diaNome: ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'][d],
          diaISO,
          cells: []
        };

        for (const room of rooms) {
          const lista = reservasDaCelula(diaISO, room, turnos);
          maxReservas = Math.max(maxReservas, lista.length);
          linha.cells.push({ room, reservas: lista });
        }

        mapa.push(linha);
      }

      return { mapa, maxReservas };
    }

    function renderTabela() {
      const tbody = document.getElementById('corpo-tabela');
      tbody.innerHTML = '';
      const turnos = getTurnos();
      const { mapa, maxReservas } = mapaSemana(turnos);

      for (const linha of mapa) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<th>${linha.diaNome}</th>`;

        for (const cell of linha.cells) {
          const td = document.createElement('td');
          const total = cell.reservas.length;
          const calor = indiceCalor(total, maxReservas);

          td.className = `semana-cell heat-${calor}`;

          if (total === 0) {
            td.innerHTML = '<span class="slot-vazio">Sem reservas</span>';
            td.title = `${linha.diaNome} · ${cell.room}: sem reservas`;
          } else {
            const resumo = cell.reservas
              .slice(0, 2)
              .map(r => `${r.hora_inicio}-${r.hora_fim} ${r.finalidade}`)
              .join(' | ');
            const restante = total > 2 ? `<br><small>+${total - 2} reserva(s)</small>` : '';

            td.innerHTML = `<strong>${total} reserva(s)</strong><br><small>${resumo}</small>${restante}`;
            td.title = `${linha.diaNome} · ${cell.room}: ${total} reserva(s)`;
          }

          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      }

      document.getElementById('semana-atual').textContent = formatarLabelSemana();
    }

    document.getElementById('semana-anterior').addEventListener('click', () => {
      semanaInicio.setDate(semanaInicio.getDate() - 7);
      renderTabela();
    });

    document.getElementById('semana-proximo').addEventListener('click', () => {
      semanaInicio.setDate(semanaInicio.getDate() + 7);
      renderTabela();
    });

    document.querySelectorAll('.filtro-turno').forEach(chk => chk.addEventListener('change', renderTabela));

    semanaInicio = inicioDaSemana(new Date());
    renderTabela();
  </script>
</body>
</html>
